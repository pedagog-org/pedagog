[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

# Shared dependency versions (referenced by crates as `dep.workspace = true` when
# code actually needs them).
[workspace.dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
axum = "0.8"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
# Stream helpers for kube watches (already in the tree through kube and sqlx).
futures = "0.3"
globset = "0.4"
ipnet = "2"
k8s-openapi = { version = "0.28", features = ["v1_32"] } # nearest offered ≥ cluster k3s 1.31 (see docs/SETUP.md)
kube = { version = "4", features = ["client", "runtime", "rustls-tls"] }
miette = { version = "7", features = ["fancy"] }
object_store = { version = "0.14", default-features = false, features = ["aws"] }
regex = "1"
# Same version object_store already pulls in.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# jobs installs the ring provider explicitly (see crates/jobs/src/main.rs).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate"] }
strum = "0.26"
strum_macros = "0.26"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
walkdir = "2"
# Reading only; deflate via the flate2 already in the tree.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }


# No panics in production paths. Allowed in tests via clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
