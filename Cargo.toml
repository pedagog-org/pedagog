[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

# Shared dependency versions (referenced by crates as `dep.workspace = true` when
# code actually needs them).
[workspace.dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] } # nearest offered ≥ cluster k3s 1.31 (see docs/SETUP.md)
kube = { version = "4", features = ["client", "runtime", "rustls-tls"] }
miette = { version = "7", features = ["fancy"] }
regex = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate"] }
strum = "0.26"
strum_macros = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
walkdir = "2"


# No panics in production paths. Allowed in tests via clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
