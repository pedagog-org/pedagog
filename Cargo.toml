[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

# Shared dependency versions (referenced by crates as `dep.workspace = true` when
# code actually needs them).
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
regex = "1"
semver = { version = "1", features = ["serde"] }
url = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
strum = "0.26"
strum_macros = "0.26"
walkdir = "2"


# No panics in production paths. Allowed in tests via clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
