[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.0.0"
rust-version = "1.88"
publish = false

# Shared dependency versions (referenced by crates as `dep.workspace = true` when
# code actually needs them).
[workspace.dependencies]
pedagog-core = { path = "crates/pedagog-core" }
ipnet = { version = "2", features = ["serde"] }
magic_migrate = "2"
miette = { version = "7", features = ["fancy"] }
semver = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tabled = "0.17"
toml = "0.8"
toml_edit = "0.22"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

# No panics in production paths. Allowed in tests via clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
