[package]
name = "pedagog-e2e"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The kind cluster's toolkit (port-forwards, Mailpit logins, personas,
# kubectl, SQL) and the end-to-end tests built on it. The tests run only
# against kind: `cargo xtask e2e` (they skip themselves otherwise).
[dependencies]
reqwest = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# zip's deflate needs flate2's default (pure Rust) backend.
flate2 = { workspace = true }
time = { workspace = true }
zip = { workspace = true }

[[test]]
name = "kind"
harness = false

[lints]
workspace = true
