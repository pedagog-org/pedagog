apiVersion: v1
kind: ServiceAccount
metadata:
  name: pedagog-jobs
  namespace: pedagog-builds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pedagog-jobs
  namespace: pedagog-builds
rules:
  # Kaniko build Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # per-build Containerfile ConfigMaps (server-side apply)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "patch", "delete"]
  # find build pods and read their logs on failure
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pedagog-jobs
  namespace: pedagog-builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pedagog-jobs
subjects:
  - kind: ServiceAccount
    name: pedagog-jobs
    namespace: pedagog-builds
