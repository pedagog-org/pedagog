apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedagog-jobs
  namespace: pedagog-builds
spec:
  replicas: 1
  # Dispatch and admission lock in Postgres, so replicas are safe; one is enough
  # for a single course.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pedagog-jobs
  template:
    metadata:
      labels:
        app: pedagog-jobs
    spec:
      serviceAccountName: pedagog-jobs
      containers:
        - name: jobs
          image: pedagog-jobs # overridden per overlay via kustomize images
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pedagog-jobs-db
                  key: url
            - name: PEDAGOG_REGISTRY
              value: registry-service.pedagog-data.svc:5000
            - name: PEDAGOG_BUILD_NAMESPACE
              value: pedagog-builds
            # Images for pods jobs launches; every overlay sets the pushed refs:
            # the full image (Kaniko's recipe staging) and pedagog/jobs-init
            # (initContainers: await-egress, fetch-context).
            - name: PEDAGOG_JOBS_IMAGE
              value: pedagog-jobs
            - name: PEDAGOG_JOBS_INIT_IMAGE
              value: pedagog-jobs-init
            # Garage: assignment archives and run results.
            - name: PEDAGOG_S3_ENDPOINT
              value: http://garage-service.pedagog-data.svc:3900
            - name: PEDAGOG_S3_BUCKET
              value: pedagog
            - name: PEDAGOG_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3-key
                  key: access-key-id
            - name: PEDAGOG_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3-key
                  key: secret-access-key
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              # uploads (up to 50 MiB) are held in memory while checked and stored
              memory: 512Mi
