# The api and jobs send events; Traefik (pedagog-system) serves the UI; the
# bootstrap Job (pedagog-data) waits for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: glitchtip
  namespace: pedagog-data
spec:
  podSelector:
    matchLabels:
      app: glitchtip
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pedagog-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pedagog-builds
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pedagog-data
      ports:
        - protocol: TCP
          port: 8000
