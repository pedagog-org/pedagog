# Defaults for any container without resources, so the ResourceQuota applies
# to every pod (jobs sets explicit resources on its own containers).
apiVersion: v1
kind: LimitRange
metadata:
  name: grading-defaults
  namespace: pedagog-grading
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
        ephemeral-storage: 1Gi
