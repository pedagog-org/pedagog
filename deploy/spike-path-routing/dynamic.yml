# M1.5 spike — Traefik dynamic config. Routes /s/test/* to the code-server container,
# stripping the /s/test prefix (code-server serves relative asset paths, so it should
# render correctly under the subpath). Throwaway: one hard-coded session id.
http:
  routers:
    session-test:
      rule: "PathPrefix(`/s/test`)"
      entryPoints: ["web"]
      service: codeserver
      middlewares: ["strip-session"]

  middlewares:
    strip-session:
      stripPrefix:
        prefixes: ["/s/test"]

  services:
    codeserver:
      loadBalancer:
        servers:
          - url: "http://cs:8080"
