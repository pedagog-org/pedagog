# kind: GlitchTip is reached through a port-forward (`just kind-api`, :18000)
# and mails Mailpit; no Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip
  namespace: pedagog-data
spec:
  template:
    spec:
      containers:
        - name: glitchtip
          env:
            - name: GLITCHTIP_DOMAIN
              value: http://localhost:18000
            - name: DEFAULT_FROM_EMAIL
              value: glitchtip@pedagog.dev
---
$patch: delete
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glitchtip
  namespace: pedagog-data
