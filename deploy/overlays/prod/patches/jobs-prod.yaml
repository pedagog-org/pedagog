# Prod: startup builds the recipes baked into the image (their ingredients are
# kept in Garage). Set PEDAGOG_JOBS_INIT_IMAGE to the pushed pedagog/jobs-init
# matching the jobs image (built with --target init; every test run's and
# build's initContainers).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedagog-jobs
  namespace: pedagog-builds
spec:
  template:
    spec:
      containers:
        - name: jobs
          env:
            - name: PEDAGOG_JOBS_INIT_IMAGE
              value: REPLACE-WITH-REGISTRY-IP:5000/pedagog/jobs-init:prod
