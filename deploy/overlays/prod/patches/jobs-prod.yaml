# Prod: startup builds pinned recipes baked into the image; the Kaniko
# initContainer stages them from PEDAGOG_JOBS_IMAGE. Set it to the same pushed
# ref as the images: override below, and PEDAGOG_JOBS_INIT_IMAGE to the matching
# pedagog/jobs-init (built with --target init; used by every test run's and
# build's initContainers).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedagog-jobs
  namespace: pedagog-builds
spec:
  template:
    spec:
      containers:
        - name: jobs
          env:
            - name: PEDAGOG_JOBS_IMAGE
              value: REPLACE-WITH-REGISTRY-IP:5000/pedagog/jobs:prod
            - name: PEDAGOG_JOBS_INIT_IMAGE
              value: REPLACE-WITH-REGISTRY-IP:5000/pedagog/jobs-init:prod
