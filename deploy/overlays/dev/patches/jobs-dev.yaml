# Dev: jobs renders builds from the live recipes checkout on the node via
# hostPath (not baked recipes), and startup does not auto-build — the rebuild
# endpoint is the trigger. Set the host path below to your recipes checkout on
# the node, and the image to your pushed ref.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedagog-jobs
  namespace: pedagog-builds
spec:
  template:
    spec:
      containers:
        - name: jobs
          env:
            - name: PEDAGOG_ENV
              value: dev
            - name: PEDAGOG_RECIPES_DIR
              value: /host/recipes
            - name: PEDAGOG_JOBS_INIT_IMAGE
              value: REPLACE-WITH-REGISTRY-IP:5000/pedagog/jobs-init:dev
          volumeMounts:
            - name: recipes-src
              mountPath: /host/recipes
              readOnly: true
      volumes:
        - name: recipes-src
          hostPath:
            path: /REPLACE-WITH-HOST-CHECKOUT/recipes
            type: Directory
