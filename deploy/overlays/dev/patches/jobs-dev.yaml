# Dev: jobs builds against the live recipes checkout on the node via hostPath
# (not baked recipes), and startup does not auto-build — the rebuild endpoint is
# the trigger. Set BOTH host paths below to your recipes checkout on the node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedagog-jobs
  namespace: pedagog-builds
spec:
  template:
    spec:
      containers:
        - name: jobs
          env:
            - name: PEDAGOG_ENV
              value: dev
            - name: PEDAGOG_RECIPES_DIR
              value: /host/recipes
            # node path handed to Kaniko pods as their /pedagog/recipes hostPath
            - name: PEDAGOG_RECIPES_HOSTPATH
              value: /REPLACE-WITH-HOST-CHECKOUT/recipes
          volumeMounts:
            - name: recipes-src
              mountPath: /host/recipes
              readOnly: true
      volumes:
        - name: recipes-src
          hostPath:
            path: /REPLACE-WITH-HOST-CHECKOUT/recipes
            type: Directory
